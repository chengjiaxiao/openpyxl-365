[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpyxl-365"
version = "0.1.1"
description = "A preservation layer for editing modern Excel 365 workbooks with openpyxl"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Cheng Jiaxiao" },
  { name = "GPT (OpenAI)" },
]
keywords = [
  "excel",
  "excel-365",
  "openpyxl",
  "ooxml",
  "dynamic-arrays",
  "xlsx",
  "xlsm",
]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
  "openpyxl>=3.1.5,<4",
]

[project.urls]
Homepage = "https://github.com/chengjiaxiao/openpyxl-365"
Repository = "https://github.com/chengjiaxiao/openpyxl-365"
Issues = "https://github.com/chengjiaxiao/openpyxl-365/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
